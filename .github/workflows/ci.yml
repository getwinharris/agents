name: CI

# The gate on main.
#
# Before this existed the repository had exactly one test check — a
# path-filtered `pull_request` job — and nothing at all on push to main. Commits
# reached main and were deployed on the strength of someone remembering to run
# the suites by hand. That failed: a build produced an empty dist, it was
# snapshotted and deployed, and bapx.in served 404s until a human noticed.
#
# Modelled on the pattern used by hermes-agent, multica and suna, all of which
# gate `branches: [main]`. `all-checks-pass` aggregates the lanes so branch
# protection only has to require one check.
#
# SECURITY: this runs PR-authored code. Do not add `secrets: inherit`, tokens,
# or deploy steps here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  www:
    name: apps/www tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Pin npm to the version the lockfile was written with. Node 24 ships a
      # different npm whose optional-dependency resolution disagrees with this
      # lockfile, and `npm ci` then fails with "Missing: @emnapi/* from lock
      # file". admin-project-import.yml already pins for the same reason.
      - run: npm install --global npm@11.6.2
      # `npm ci` installs the lockfile exactly. `npm install` re-resolves and has
      # twice broken this build — removing the nested cookie@2.0.1 Astro needs,
      # and duplicating shiki under @streamdown/code.
      - run: npm ci --no-audit --no-fund
      - name: Server and platform contracts
        run: npm run test:server --workspace apps-www
      # The build is a gate, not a formality: an empty dist is what reached
      # production. Astro, docs validation and the admin bundle all run here.
      - name: Build
        run: npm run build --workspace apps-www
      # A build that "succeeds" while emitting nothing must still fail.
      - name: Assert the build produced real output
        run: |
          pages=$(find apps/www/dist -name '*.html' | wc -l)
          admin=$(du -sm apps/www/dist/admin | cut -f1)
          echo "pages=$pages adminMB=$admin"
          test "$pages" -gt 100 || { echo "::error::only $pages pages built"; exit 1; }
          test "$admin" -gt 10 || { echo "::error::admin bundle is ${admin}MB"; exit 1; }

  runtime:
    name: agents-runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Pin npm to the version the lockfile was written with. Node 24 ships a
      # different npm whose optional-dependency resolution disagrees with this
      # lockfile, and `npm ci` then fails with "Missing: @emnapi/* from lock
      # file". admin-project-import.yml already pins for the same reason.
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      - run: node --test apps/agents-runtime/test/*.test.mjs

  drift:
    name: Map and OKF freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Pin npm to the version the lockfile was written with. Node 24 ships a
      # different npm whose optional-dependency resolution disagrees with this
      # lockfile, and `npm ci` then fails with "Missing: @emnapi/* from lock
      # file". admin-project-import.yml already pins for the same reason.
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      # bapX runs from packages/cli/dist, which is gitignored, so a clean
      # checkout has no CLI at all. Without this the drift lane dies with
      # ERR_MODULE_NOT_FOUND rather than reporting drift.
      - name: Build the CLI that the drift checks run through
        run: npm run build --workspace @bapX/cli
      # map.mmd was six days stale before anyone checked. Generated artefacts
      # that nothing verifies are worse than none: they are read as current.
      - name: map.mmd is current
        run: node_modules/.bin/bapX map --check --root .
      - name: Every tracked Markdown file is OKF-shaped
        run: node_modules/.bin/bapX okf normalize --root .

  cli:
    name: packages/cli tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NOT blocking yet, and this is deliberate rather than lax. Three suites
    # (config, dev, docs) are currently failing on main and predate this
    # workflow. Making them blocking on day one would paint main red and teach
    # everyone to ignore the gate. Tracked in #154 — remove this line when it
    # closes, and never extend it to another lane.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Pin npm to the version the lockfile was written with. Node 24 ships a
      # different npm whose optional-dependency resolution disagrees with this
      # lockfile, and `npm ci` then fails with "Missing: @emnapi/* from lock
      # file". admin-project-import.yml already pins for the same reason.
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      - run: node --test packages/cli/test/*.test.mjs

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Pin npm to the version the lockfile was written with. Node 24 ships a
      # different npm whose optional-dependency resolution disagrees with this
      # lockfile, and `npm ci` then fails with "Missing: @emnapi/* from lock
      # file". admin-project-import.yml already pins for the same reason.
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      # This product stores customer provider keys and connector credentials.
      # Running nothing was not a defensible position.
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high

  all-checks-pass:
    name: All checks pass
    runs-on: ubuntu-latest
    needs: [www, runtime, drift, audit]
    if: always()
    steps:
      # `needs` success is not enough on its own: a skipped or cancelled job
      # would otherwise let the gate report green, so each lane is named.
      - name: Verify every required lane succeeded
        env:
          WWW: ${{ needs.www.result }}
          RUNTIME: ${{ needs.runtime.result }}
          DRIFT: ${{ needs.drift.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "www=$WWW runtime=$RUNTIME drift=$DRIFT audit=$AUDIT"
          for lane in "www:$WWW" "runtime:$RUNTIME" "drift:$DRIFT" "audit:$AUDIT"; do
            name="${lane%%:*}"; result="${lane#*:}"
            test "$result" = "success" || { echo "::error::lane $name reported $result"; exit 1; }
          done
