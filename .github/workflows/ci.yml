name: CI

# The gate on main.
#
# Before this existed the repository had exactly one test check — a
# path-filtered `pull_request` job — and nothing at all on push to main. Commits
# reached main and were deployed on the strength of someone remembering to run
# the suites by hand. That failed: a build produced an empty dist, it was
# snapshotted and deployed, and bapx.in served 404s until a human noticed.
#
# Modelled on the pattern used by hermes-agent, multica and suna, all of which
# gate `branches: [main]`. `all-checks-pass` aggregates the lanes so branch
# protection only has to require one check.
#
# SECURITY: this runs PR-authored code. Do not add `secrets: inherit`, tokens,
# or deploy steps here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  www:
    name: apps/www tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # npm ci runs PR-authored lifecycle scripts below. Do not leave a
          # usable token in .git/config where they can read it.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      # Pin npm to the version the lockfile was written with. Node 24 ships a
      # different npm whose optional-dependency resolution disagrees with this
      # lockfile, and `npm ci` then fails with "Missing: @emnapi/* from lock
      # file". admin-project-import.yml already pins for the same reason.
      - run: npm install --global npm@11.6.2
      # `npm ci` installs the lockfile exactly. `npm install` re-resolves and has
      # twice broken this build — removing the nested cookie@2.0.1 Astro needs,
      # and duplicating shiki under @streamdown/code.
      - run: npm ci --no-audit --no-fund
      # @bapX/sdk and @bapX/react export gitignored dist paths, and the admin
      # bundle imports both. Without this, tsc -b cannot resolve them and the
      # lane fails for every PR instead of gating regressions.
      - name: Build shared packages
        run: npm run build --workspace @bapX/runtime --workspace @bapX/sdk --workspace @bapX/react
      - name: Server and platform contracts
        run: npm run test:server --workspace apps-www
      # The build is a gate, not a formality: an empty dist is what reached
      # production. Astro, docs validation and the admin bundle all run here.
      - name: Build
        run: npm run build --workspace apps-www
      # A build that "succeeds" while emitting nothing must still fail.
      - name: Assert the build produced real output
        run: |
          pages=$(find apps/www/dist -name '*.html' | wc -l)
          admin=$(du -sm apps/www/dist/admin | cut -f1)
          echo "pages=$pages adminMB=$admin"
          test "$pages" -gt 100 || { echo "::error::only $pages pages built"; exit 1; }
          test "$admin" -gt 10 || { echo "::error::admin bundle is ${admin}MB"; exit 1; }

  runtime:
    name: agents-runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # npm ci runs PR-authored lifecycle scripts below. Do not leave a
          # usable token in .git/config where they can read it.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      # Pin npm to the version the lockfile was written with. Node 24 ships a
      # different npm whose optional-dependency resolution disagrees with this
      # lockfile, and `npm ci` then fails with "Missing: @emnapi/* from lock
      # file". admin-project-import.yml already pins for the same reason.
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      # check:types resolves @bapX/cli/config and @bapX/runtime declarations,
      # both of which live in gitignored dist.
      - name: Build shared packages
        run: npm run build --workspace @bapX/runtime --workspace @bapX/sdk --workspace @bapX/react --workspace @bapX/cli
      - run: node --test apps/agents-runtime/test/*.test.mjs
      # The suites import the adjacent .mjs helpers only, so a broken TypeScript
      # entry point in src/ or bapX.config.ts stays invisible to them.
      - name: Types
        run: npm run check:types --workspace apps/agents-runtime

  packages:
    name: packages/runtime tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      - name: Build shared packages
        run: npm run build --workspace @bapX/runtime --workspace @bapX/sdk --workspace @bapX/react
      # @bapX/runtime is the primary package. Nothing ran its 52 suites, so a
      # regression there could leave the aggregate check green.
      # Five of 785 suites fail on main and predate this workflow (#156).
      # Types stay blocking below — they are green and catch real regressions.
      # Remove this line when #156 closes, and never extend it to another step.
      - name: Runtime tests
        continue-on-error: true
        run: npm run test --workspace @bapX/runtime
      - name: Runtime types
        run: npm run check:types --workspace @bapX/runtime

  drift:
    name: Map and OKF freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # npm ci runs PR-authored lifecycle scripts below. Do not leave a
          # usable token in .git/config where they can read it.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      # Pin npm to the version the lockfile was written with. Node 24 ships a
      # different npm whose optional-dependency resolution disagrees with this
      # lockfile, and `npm ci` then fails with "Missing: @emnapi/* from lock
      # file". admin-project-import.yml already pins for the same reason.
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      # bapX loads @bapX/runtime at runtime, and the CLI's own dist is
      # gitignored, so both must exist before the CLI can run at all.
      - name: Build shared packages
        run: npm run build --workspace @bapX/runtime --workspace @bapX/sdk --workspace @bapX/react
      # bapX runs from packages/cli/dist, which is gitignored, so a clean
      # checkout has no CLI at all. Without this the drift lane dies with
      # ERR_MODULE_NOT_FOUND rather than reporting drift.
      - name: Build the CLI that the drift checks run through
        run: npm run build --workspace @bapX/cli
      # map.mmd was six days stale before anyone checked. Generated artefacts
      # that nothing verifies are worse than none: they are read as current.
      - name: map.mmd is current
        run: node_modules/.bin/bapX map --check --root .
      # Regenerate and diff rather than checking that index.yaml merely exists:
      # adding a document to a folder that already has an index leaves the index
      # stale, and an existence check passes it.
      - name: Generated OKF indexes match the tree
        run: |
          node_modules/.bin/bapX okf normalize --root . --write
          git diff --exit-code -- '*.md' '*index.yaml' || {
            echo "::error::OKF frontmatter or folder indexes are stale. Run: npm run okf:write"
            exit 1
          }

  cli:
    name: packages/cli tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NOT blocking yet, and this is deliberate rather than lax. Three suites
    # (config, dev, docs) are currently failing on main and predate this
    # workflow. Making them blocking on day one would paint main red and teach
    # everyone to ignore the gate. Tracked in #154 — remove this line when it
    # closes, and never extend it to another lane.
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # npm ci runs PR-authored lifecycle scripts below. Do not leave a
          # usable token in .git/config where they can read it.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      # Pin npm to the version the lockfile was written with. Node 24 ships a
      # different npm whose optional-dependency resolution disagrees with this
      # lockfile, and `npm ci` then fails with "Missing: @emnapi/* from lock
      # file". admin-project-import.yml already pins for the same reason.
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      # The suites spawn packages/cli/dist/bapX.js, which imports @bapX/runtime
      # from its own gitignored dist. Both must be built.
      - name: Build the CLI under test
        run: npm run build --workspace @bapX/runtime --workspace @bapX/sdk --workspace @bapX/react --workspace @bapX/cli
      - run: node --test packages/cli/test/*.test.mjs

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # npm ci runs PR-authored lifecycle scripts below. Do not leave a
          # usable token in .git/config where they can read it.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      # Pin npm to the version the lockfile was written with. Node 24 ships a
      # different npm whose optional-dependency resolution disagrees with this
      # lockfile, and `npm ci` then fails with "Missing: @emnapi/* from lock
      # file". admin-project-import.yml already pins for the same reason.
      - run: npm install --global npm@11.6.2
      - run: npm ci --no-audit --no-fund
      # This product stores customer provider keys and connector credentials.
      # Running nothing was not a defensible position.
      #
      # Gated on production dependencies: those are what reach the VPS. The
      # remaining high findings are dev tooling only
      # (@cloudflare/vite-plugin -> miniflare -> undici, and hono via
      # @hono/node-server), and fixing them needs semver-major bumps. They are
      # reported below without failing the lane, so they stay visible instead of
      # being silenced.
      - name: Production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Development dependencies (report only)
        if: always()
        run: npm audit --audit-level=high || true

  all-checks-pass:
    name: All checks pass
    runs-on: ubuntu-latest
    needs: [www, runtime, packages, drift, audit]
    if: always()
    steps:
      # `needs` success is not enough on its own: a skipped or cancelled job
      # would otherwise let the gate report green, so each lane is named.
      - name: Verify every required lane succeeded
        env:
          WWW: ${{ needs.www.result }}
          RUNTIME: ${{ needs.runtime.result }}
          PACKAGES: ${{ needs.packages.result }}
          DRIFT: ${{ needs.drift.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "www=$WWW runtime=$RUNTIME packages=$PACKAGES drift=$DRIFT audit=$AUDIT"
          for lane in "www:$WWW" "runtime:$RUNTIME" "packages:$PACKAGES" "drift:$DRIFT" "audit:$AUDIT"; do
            name="${lane%%:*}"; result="${lane#*:}"
            test "$result" = "success" || { echo "::error::lane $name reported $result"; exit 1; }
          done
